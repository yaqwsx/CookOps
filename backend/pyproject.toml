[project]
name = "cookops-backend"
version = "0.1.0"
description = "CookOps API backend"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "iso4217>=1.14,<2",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
    "google-auth[requests]>=2.40,<3",
    "cachecontrol>=0.14,<1",
    "pillow>=11,<12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/cookops"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
