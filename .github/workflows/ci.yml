name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
        env:
          POSTGRES_DB: cookops
          POSTGRES_PASSWORD: cookops
          POSTGRES_USER: cookops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookops -d cookops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cookops:cookops@127.0.0.1:5432/cookops
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.9.28
          python-version: "3.12"
          working-directory: backend
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Upgrade Alembic database
        env:
          COOKOPS_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head
      - name: Check Alembic metadata drift
        env:
          COOKOPS_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic check
      - name: Check MCP resource server
        working-directory: spikes/mcp-oauth/resource-server
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      - name: Test MCP resource server
        working-directory: spikes/mcp-oauth/resource-server
        run: uv run --locked pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check generated API client drift
        run: npm run check:api
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production application end to end
        run: npm run test:e2e

  container-images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test production images
        run: deploy/test-images.sh

  vulnerability-scan:
    name: Dependency and image vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate vulnerability exception policy
        run: python3 security/validate-vulnerability-exceptions.py security/vulnerability-exceptions.yaml
      - name: Build production images for this commit
        run: |
          docker build --tag cookops-api:${GITHUB_SHA} backend
          docker build --tag cookops-web:${GITHUB_SHA} frontend
          docker build --tag cookops-oauth:${GITHUB_SHA} oauth-server
      - name: Prepare SARIF output directory
        run: mkdir -p security-results
      - name: Scan locked dependencies
        id: scan-dependencies
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: security-results/dependencies.sarif
          trivyignores: security/vulnerability-exceptions.yaml
          version: v0.74.0
      - name: Scan API image
        id: scan-api
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: cookops-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: security-results/api.sarif
          trivyignores: security/vulnerability-exceptions.yaml
          version: v0.74.0
      - name: Scan frontend image
        id: scan-web
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: cookops-web:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: security-results/web.sarif
          trivyignores: security/vulnerability-exceptions.yaml
          version: v0.74.0
      - name: Scan OAuth image
        id: scan-oauth
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: cookops-oauth:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: security-results/oauth.sarif
          trivyignores: security/vulnerability-exceptions.yaml
          version: v0.74.0
      - name: Validate reports and fail closed
        if: always()
        env:
          DEPENDENCY_SCAN: ${{ steps.scan-dependencies.outcome }}
          API_SCAN: ${{ steps.scan-api.outcome }}
          WEB_SCAN: ${{ steps.scan-web.outcome }}
          OAUTH_SCAN: ${{ steps.scan-oauth.outcome }}
        run: |
          set -eu
          test "$DEPENDENCY_SCAN" = success
          test "$API_SCAN" = success
          test "$WEB_SCAN" = success
          test "$OAUTH_SCAN" = success
          for report in security-results/*.sarif; do
            python3 security/validate-sarif.py "$report"
          done
      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-scan-sarif
          path: security-results/*.sarif
          if-no-files-found: error

  oauth-provider-profile:
    name: OAuth provider and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
        env:
          POSTGRES_DB: cookops_oauth_test
          POSTGRES_PASSWORD: cookops_oauth_test
          POSTGRES_USER: cookops_oauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookops_oauth_test -d cookops_oauth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cookops_oauth_test:cookops_oauth_test@127.0.0.1:5432/cookops_oauth_test
    defaults:
      run:
        working-directory: spikes/mcp-oauth/oauth-server
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/mcp-oauth/oauth-server/package-lock.json
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.9.28
          python-version: "3.12"
          working-directory: spikes/mcp-oauth/resource-server
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Test provider profile
        run: npm test
      - name: Prove OAuth state survives a PostgreSQL restart
        run: ../test-postgres-restart.sh
      - name: Test an authenticated MCP request end to end
        working-directory: spikes/mcp-oauth/resource-server
        env:
          OAUTH_E2E_DATABASE_URL: postgresql://cookops_oauth_test:cookops_oauth_test@127.0.0.1:5432/cookops_oauth_test
        run: uv run --locked pytest tests/test_authenticated_mcp_e2e.py
      - name: Check production OAuth foundation
        working-directory: oauth-server
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Install browser smoke dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Complete a real production OAuth consent interaction in a browser
        run: deploy/test-oauth-consent-smoke.sh
