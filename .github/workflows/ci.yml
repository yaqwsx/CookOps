name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
        env:
          POSTGRES_DB: cookops
          POSTGRES_PASSWORD: cookops
          POSTGRES_USER: cookops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookops -d cookops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cookops:cookops@127.0.0.1:5432/cookops
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.9.28
          python-version: "3.12"
          working-directory: backend
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Upgrade Alembic database
        env:
          COOKOPS_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head
      - name: Check Alembic metadata drift
        env:
          COOKOPS_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic check
      - name: Check MCP resource server
        working-directory: spikes/mcp-oauth/resource-server
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
      - name: Test MCP resource server
        working-directory: spikes/mcp-oauth/resource-server
        run: uv run --locked pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check generated API client drift
        run: npm run check:api
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production application end to end
        run: npm run test:e2e

  container-images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test production images
        run: deploy/test-images.sh

  oauth-provider-profile:
    name: OAuth provider and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
        env:
          POSTGRES_DB: cookops_oauth_test
          POSTGRES_PASSWORD: cookops_oauth_test
          POSTGRES_USER: cookops_oauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookops_oauth_test -d cookops_oauth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cookops_oauth_test:cookops_oauth_test@127.0.0.1:5432/cookops_oauth_test
    defaults:
      run:
        working-directory: spikes/mcp-oauth/oauth-server
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/mcp-oauth/oauth-server/package-lock.json
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.9.28
          python-version: "3.12"
          working-directory: spikes/mcp-oauth/resource-server
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Test provider profile
        run: npm test
      - name: Prove OAuth state survives a PostgreSQL restart
        run: ../test-postgres-restart.sh
      - name: Test an authenticated MCP request end to end
        working-directory: spikes/mcp-oauth/resource-server
        env:
          OAUTH_E2E_DATABASE_URL: postgresql://cookops_oauth_test:cookops_oauth_test@127.0.0.1:5432/cookops_oauth_test
        run: uv run --locked pytest tests/test_authenticated_mcp_e2e.py
      - name: Check production OAuth foundation
        working-directory: oauth-server
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Install browser smoke dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Complete a real production OAuth consent interaction in a browser
        run: deploy/test-oauth-consent-smoke.sh
