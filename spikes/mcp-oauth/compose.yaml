services:
  postgres:
    image: postgres@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
    environment:
      POSTGRES_DB: cookops_oauth_test
      POSTGRES_PASSWORD: cookops_oauth_test
      POSTGRES_USER: cookops_oauth_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookops_oauth_test -d cookops_oauth_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - oauth-postgres-data:/var/lib/postgresql

  oauth-test:
    build: oauth-server
    command: npm test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://cookops_oauth_test:cookops_oauth_test@postgres:5432/cookops_oauth_test

  conformance:
    image: node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    entrypoint: ["npx", "--yes", "@modelcontextprotocol/conformance@0.1.16", "server"]

volumes:
  oauth-postgres-data:
