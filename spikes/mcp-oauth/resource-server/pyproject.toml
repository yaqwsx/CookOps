[project]
name = "cookops-mcp-oauth-spike-resource-server"
version = "0.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp==2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
