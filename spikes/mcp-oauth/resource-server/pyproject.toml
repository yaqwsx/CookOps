[project]
name = "cookops-mcp-oauth-spike-resource-server"
version = "0.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "mcp==2.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "uvicorn>=0.52,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
