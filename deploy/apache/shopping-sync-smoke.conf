<VirtualHost *:443>
    ServerName 127.0.0.1
    SSLEngine on
    SSLCertificateFile /run/cookops-smoke/certificate.pem
    SSLCertificateKeyFile /run/cookops-smoke/key.pem
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}
    ProxyPass        /auth/ http://api:8000/auth/
    ProxyPassReverse /auth/ http://api:8000/auth/
    ProxyPass        /api/v1/sync/hints http://api:8000/api/v1/sync/hints upgrade=websocket
    ProxyPassReverse /api/v1/sync/hints http://api:8000/api/v1/sync/hints
    ProxyPass        /api/ http://api:8000/api/
    ProxyPassReverse /api/ http://api:8000/api/
    ProxyPass        / http://web:8080/
    ProxyPassReverse / http://web:8080/
</VirtualHost>
