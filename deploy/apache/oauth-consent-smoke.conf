# Smoke-only HTTPS edge derived from cookops.conf.example. It keeps exactly the
# public OAuth and browser-authentication routes needed by this flow.
<VirtualHost *:443>
    ServerName 127.0.0.1
    SSLEngine on
    SSLCertificateFile /run/cookops-smoke/certificate.pem
    SSLCertificateKeyFile /run/cookops-smoke/key.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}

    ProxyPass        /health/ http://api:8000/health/
    ProxyPassReverse /health/ http://api:8000/health/
    ProxyPass        /auth/ http://api:8000/auth/
    ProxyPassReverse /auth/ http://api:8000/auth/
    ProxyPass        /oauth/private !
    ProxyPass        /.well-known/openid-configuration/oauth http://oauth-server:3000/.well-known/openid-configuration/oauth
    ProxyPassReverse /.well-known/openid-configuration/oauth http://oauth-server:3000/.well-known/openid-configuration/oauth
    ProxyPass        /.well-known/oauth-authorization-server/oauth http://oauth-server:3000/.well-known/oauth-authorization-server/oauth
    ProxyPassReverse /.well-known/oauth-authorization-server/oauth http://oauth-server:3000/.well-known/oauth-authorization-server/oauth
    ProxyPass        /oauth/ http://oauth-server:3000/oauth/
    ProxyPassReverse /oauth/ http://oauth-server:3000/oauth/
</VirtualHost>
